[package]
name    = "payment_channels"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib"]

[features]
# Deployment selection (program id, treasury owner) lives in ../../Solex.toml
# and is chosen per build with SOLEX_CHANNEL; see `solex channels`. There are
# no cluster features anymore.
default = []
# V2 lifecycle hooks. Channel-managed: Solex.toml [features.hooks] decides
# which channels enable it; `solex build`/`solex test` pass --features.
hooks = []
# Retained for host integration harnesses that inspect the full core state.
# On-chain consumers use payment-channel-interface instead. On SBF this program
# still owns its allocator/panic handler; host library consumers link std because
# this package also builds a cdylib.
no-entrypoint = []
# Enables codama derives + raw build.rs IDL emission. Host-only; must NOT
# be enabled for `cargo build-sbf` (see `compile_error!` guard in
# src/lib.rs). Use `just generate-idl` to apply Codama visitors and write
# the committed IDL.
idl = ["dep:codama", "dep:serde_json"]

[build-dependencies]
codama = { version = "0.9.1", optional = true }
serde_json = { version = "1", optional = true }
solex-types = { version = "0.2.0", default-features = false, features = ["toml"] }

[dependencies]
payment-channel-interface         = { version = "0.1.0", path = "../../crates/interface" }
pinocchio                          = { version = "0.11.1", features = ["cpi", "copy", "account-resize"] }
solex-lang                         = { version = "0.2.0", default-features = false, features = ["pinocchio"] }
solana-address                     = { version = "2", features = ["curve25519", "borsh"] }
pinocchio-associated-token-account = "0.4.0"
pinocchio-system                   = "0.6.0"
pinocchio-token                    = "0.6.0"
pinocchio-token-2022               = "0.3.1"
codama                             = { version = "0.9.1", optional = true }
const-crypto                       = "0.3"
borsh                              = { version = "1", default-features = false, features = ["derive"] }
thiserror                          = { version = "2", default-features = false }

[dev-dependencies]
# Agave 4 understands the SBPFv3 ELF layout emitted by platform-tools v1.58.
litesvm                  = { version = "0.13.1", features = ["precompiles"] }
litesvm-token            = { version = "0.13.1", features = ["token-2022"] }
payment_channels_client  = { workspace = true }
solana-account           = "^3"
solana-clock             = "^3"
solana-instruction       = "^3"
solana-keypair           = "^3"
solana-message           = "^3"
solana-pubkey            = "^3"
solana-rent              = "^3"
solana-signer            = "^3"
solana-system-interface  = "^3"
solana-transaction       = "^3"
solana-transaction-error = "^3"
serde_json               = "1"
rstest                   = "0.26"
blake3                   = { version = "1", default-features = false }
mollusk-svm              = "0.11.0"
solana-instructions-sysvar = "^3"
solana-program-error       = "^3"
solana-program-pack        = "3.1.0"
spl-token-2022-interface   = "2.1.0"
tabled                     = "0.17"
ctor                       = "0.2"
solana-address-lookup-table-interface = { version = "^3", features = ["bincode"] }
solana-compute-budget                 = { version = "^3", features = ["agave-unstable-api"] }
solana-compute-budget-interface       = "^3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
