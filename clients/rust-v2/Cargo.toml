[package]
name = "payment_channels_client_v2"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Keep enabling the V2 program in parity tests from unifying features into the
# default V1 workspace's program tests.
[workspace]

[dependencies]
borsh = { version = "1", features = ["derive"] }
num-derive = "0.4"
num-traits = "0.2"
solana-account = "^3"
solana-account-info = "^3"
solana-address = { version = "2", features = ["borsh", "curve25519"] }
solana-cpi = "^3"
solana-instruction = "^3"
solana-program-error = "^3"
spl-collections = { version = "0.1.2", features = ["borsh"] }
thiserror = "2"

[dev-dependencies]
payment_channels = { path = "../../program/payment_channels", features = ["v2"] }
serde_json = "1"

[features]
default = []

# Codama emits optional Anchor/RPC helpers, but this wire-only experimental
# crate intentionally does not expose those unvalidated integrations.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("fetch", "anchor", "anchor-idl-build"))'] }
